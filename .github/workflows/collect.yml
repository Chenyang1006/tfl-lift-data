name: Collect TfL lift disruptions

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run a little late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect-lifts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Collect a snapshot
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python3 collect_lifts.py

      - name: Save the data to the repository
        run: |
          git config user.name "lift-data-bot"
          git config user.email "lift-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Lift data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
